services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: crystal-web:local
    container_name: crystal-web
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=crystal_task_manager;Username=postgres;Password=postgres
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: crystal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: crystal_task_manager
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d crystal_task_manager"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
