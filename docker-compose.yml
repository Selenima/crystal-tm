services:
  postgres:
    image: postgres:16-alpine
    container_name: crystal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: crystal_task_manager
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d crystal_task_manager"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
